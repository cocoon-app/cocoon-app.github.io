<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download Cocoon</title>
<meta name="color-scheme" content="dark light">
<link rel="icon" type="image/png" href="../assets/favicon-64.png">
<style>
@font-face { font-family: "Geist"; font-weight: 300 900; font-display: swap; src: url(../assets/fonts/geist-latin.woff2) format("woff2"); }
:root { --bg: #0E0E12; --fg: #F2F0F7; --fg-2: #ABA8BA; --accent: #7457FF; }
@media (prefers-color-scheme: light) { :root { --bg: #F6F3EE; --fg: #121019; --fg-2: #4E4A5C; --accent: #5B3DF0; } }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 400 17px/1.6 "Geist", -apple-system, system-ui, sans-serif; display: grid; place-items: center; text-align: center; padding: 24px; }
h1 { font-size: 40px; letter-spacing: -.05em; margin: 18px 0 8px; }
p { color: var(--fg-2); margin: 6px 0; }
a.btn { display: inline-block; margin-top: 22px; padding: 14px 26px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
svg { width: 26px; height: 56px; color: var(--accent); }
</style>
</head>
<body>
<main>
  <svg viewBox="320 60 384 840" aria-hidden="true"><path d="M512 86 L512 262" stroke="currentColor" stroke-width="30" stroke-linecap="round"/><path d="M512 246 C 566 330 690 440 690 616 C 690 788 610 886 512 886 C 414 886 334 788 334 616 C 334 440 458 330 512 246 Z" fill="currentColor"/></svg>
  <h1>Your download is starting</h1>
  <p id="v">Getting the newest version of Cocoon…</p>
  <p>Open Cocoon.dmg and drag Cocoon into Applications.</p>
  <a class="btn" id="dl" href="download/Cocoon.dmg">Download again</a>
</main>
<script>
  // Starts the newest version's download; the button stays as a manual fallback.
  fetch('latest.json', { cache: 'no-store' }).then(r => r.json()).then(r => {
    document.getElementById('dl').href = r.url;
    document.getElementById('v').textContent = `Cocoon ${r.version} beta, ${Math.round(r.size / 1048576)} MB`;
    location.href = r.url;
  }).catch(() => { document.getElementById('v').textContent = 'Press the button to download Cocoon.'; });
</script>
</body>
</html>
